# ============================================================================
#  PERFIL loadtest SOLO para pruebas de carga LOCALES (JMeter).
#  Activar con:  --spring.profiles.active=loadtest   (o SPRING_PROFILES_ACTIVE)
#  NUNCA activar en producción (usar BD local y secretos dummy).
#
#  Hereda de application.properties y sobrescribe: datasource local, pool y logging.
# ============================================================================

# Base de datos LOCAL”€
spring.datasource.url=jdbc:postgresql://localhost:5432/skill_bridge
spring.datasource.username=postgres
spring.datasource.password=admin

# Pool de conexiones afinado (default es 10 cuello de botella)”€
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# Logging SQL APAGADO (loguear cada query mata el rendimiento bajo carga)”€
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# Secretos DUMMY (solo local, evita depender de variables de entorno)”€
security.jwt.secret-key=ZHVtbXktdGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC1hdC1sZWFzdC0zMi1ieXRlcw==
spring.security.oauth2.client.registration.google.client-id=dummy-loadtest
spring.security.oauth2.client.registration.google.client-secret=dummy-loadtest
