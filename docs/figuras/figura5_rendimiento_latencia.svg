<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A5C38">Rendimiento y latencia según la concurrencia</text>

  <!-- grid + left axis (throughput 0-50) -->
  <g stroke="#E4E8E6" stroke-width="1">
    <line x1="90" y1="340" x2="660" y2="340"/>
    <line x1="90" y1="284" x2="660" y2="284"/>
    <line x1="90" y1="228" x2="660" y2="228"/>
    <line x1="90" y1="172" x2="660" y2="172"/>
    <line x1="90" y1="116" x2="660" y2="116"/>
    <line x1="90" y1="60"  x2="660" y2="60"/>
  </g>
  <g font-size="12" fill="#5A6B60" text-anchor="end">
    <text x="80" y="344">0</text><text x="80" y="288">10</text><text x="80" y="232">20</text>
    <text x="80" y="176">30</text><text x="80" y="120">40</text><text x="80" y="64">50</text>
  </g>
  <!-- right axis (latency 0-40 ms) -->
  <g font-size="12" fill="#B06A1E" text-anchor="start">
    <text x="668" y="344">0</text><text x="668" y="274">10</text><text x="668" y="204">20</text>
    <text x="668" y="134">30</text><text x="668" y="64">40</text>
  </g>

  <!-- axis titles -->
  <text x="26" y="200" font-size="13" fill="#1A5C38" transform="rotate(-90 26 200)" text-anchor="middle">Rendimiento (peticiones/s)</text>
  <text x="706" y="200" font-size="13" fill="#B06A1E" transform="rotate(90 706 200)" text-anchor="middle">Latencia media (ms)</text>

  <!-- baseline -->
  <line x1="90" y1="340" x2="660" y2="340" stroke="#9AA8A0" stroke-width="1.5"/>

  <!-- bars: throughput 17.2 / 33.8 / 42.4  (scale 280px per 50) -->
  <g fill="#1A5C38">
    <rect x="150" y="244" width="70" height="96"/>
    <rect x="340" y="151" width="70" height="189"/>
    <rect x="530" y="103" width="70" height="237"/>
  </g>
  <g font-size="12" fill="#1A5C38" font-weight="bold" text-anchor="middle">
    <text x="185" y="236">17,2</text>
    <text x="375" y="143">33,8</text>
    <text x="565" y="95">42,4</text>
  </g>

  <!-- latency line: 24.3 / 24.7 / 27.4 (right scale 280px per 40) -->
  <polyline points="185,170 375,167 565,148" fill="none" stroke="#C77D2E" stroke-width="2.5"/>
  <g fill="#C77D2E">
    <circle cx="185" cy="170" r="4.5"/><circle cx="375" cy="167" r="4.5"/><circle cx="565" cy="148" r="4.5"/>
  </g>
  <g font-size="12" fill="#B06A1E" font-weight="bold" text-anchor="middle">
    <text x="185" y="162">24,3</text>
    <text x="375" y="159">24,7</text>
    <text x="565" y="140">27,4</text>
  </g>

  <!-- x categories -->
  <g font-size="13" fill="#24312A" text-anchor="middle">
    <text x="185" y="360">100 usuarios</text>
    <text x="375" y="360">200 usuarios</text>
    <text x="565" y="360">250 usuarios</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#24312A">
    <rect x="210" y="392" width="16" height="12" fill="#1A5C38"/>
    <text x="232" y="402">Rendimiento (peticiones/s)</text>
    <line x1="430" y1="398" x2="454" y2="398" stroke="#C77D2E" stroke-width="2.5"/>
    <circle cx="442" cy="398" r="4.5" fill="#C77D2E"/>
    <text x="460" y="402">Latencia media (ms)</text>
  </g>
</svg>
