<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5A6B60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="840" height="340" fill="#FFFFFF"/>
  <text x="420" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1A5C38">Arquitectura de despliegue</text>

  <!-- Google OAuth -->
  <rect x="455" y="55" width="150" height="52" rx="8" fill="#F4F6F5" stroke="#B8C2BC"/>
  <text x="530" y="80" text-anchor="middle" font-size="13" fill="#24312A">Google</text>
  <text x="530" y="97" text-anchor="middle" font-size="13" fill="#24312A">OAuth 2.0</text>
  <line x1="530" y1="107" x2="530" y2="150" stroke="#5A6B60" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- A Usuario -->
  <rect x="20" y="160" width="150" height="80" rx="8" fill="#EAF2ED" stroke="#1A5C38"/>
  <text x="95" y="196" text-anchor="middle" font-size="14" fill="#24312A">Usuario</text>
  <text x="95" y="215" text-anchor="middle" font-size="13" fill="#5A6B60">(navegador web)</text>

  <!-- B Netlify -->
  <rect x="230" y="150" width="180" height="100" rx="8" fill="#EAF2ED" stroke="#1A5C38"/>
  <text x="320" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A5C38">Netlify</text>
  <text x="320" y="206" text-anchor="middle" font-size="13" fill="#24312A">Frontend Angular</text>
  <text x="320" y="223" text-anchor="middle" font-size="13" fill="#5A6B60">(SPA)</text>

  <!-- C Render -->
  <rect x="470" y="150" width="190" height="100" rx="8" fill="#EAF2ED" stroke="#1A5C38"/>
  <text x="565" y="185" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A5C38">Render (Docker)</text>
  <text x="565" y="206" text-anchor="middle" font-size="13" fill="#24312A">API Spring Boot</text>
  <text x="565" y="223" text-anchor="middle" font-size="13" fill="#5A6B60">(Java 17)</text>

  <!-- D Neon -->
  <rect x="700" y="160" width="120" height="80" rx="8" fill="#EAF2ED" stroke="#1A5C38"/>
  <text x="760" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#1A5C38">Neon</text>
  <text x="760" y="211" text-anchor="middle" font-size="13" fill="#24312A">PostgreSQL 16</text>

  <!-- arrows -->
  <line x1="170" y1="200" x2="230" y2="200" stroke="#5A6B60" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="410" y1="200" x2="470" y2="200" stroke="#5A6B60" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="440" y="188" text-anchor="middle" font-size="11" fill="#5A6B60">HTTPS · REST</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#5A6B60">JWT</text>
  <line x1="660" y1="200" x2="700" y2="200" stroke="#5A6B60" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="680" y="188" text-anchor="middle" font-size="11" fill="#5A6B60">JDBC</text>
</svg>
